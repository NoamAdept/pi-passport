# pi-passport DHCP — rendered by install.sh.
# DNS is disabled here (port=0); clients resolve through Tor's DNSPort.
port=0
interface={{AP_IF}}
bind-dynamic
except-interface=lo
dhcp-authoritative
dhcp-range={{DHCP_START}},{{DHCP_END}},255.255.255.0,12h
dhcp-option=option:router,{{AP_ADDR}}
dhcp-option=option:dns-server,{{AP_ADDR}}
no-hosts
no-resolv
