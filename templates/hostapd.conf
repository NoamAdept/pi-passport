# pi-passport hotspot — rendered by install.sh. Contains the Wi-Fi secret: 0600.
interface={{AP_IF}}
driver=nl80211
ctrl_interface=/run/hostapd
ctrl_interface_group=0

ssid={{SSID}}
utf8_ssid=1
country_code={{WIFI_REGION}}
ieee80211d=1
hw_mode=g
channel={{CHANNEL}}
ieee80211n=1
wmm_enabled=1

# Clients cannot see or talk to each other.
ap_isolate=1
auth_algs=1
ignore_broadcast_ssid=0
max_num_sta=16

# WPA3-SAE (or WPA2/WPA3 transition) with protected management frames.
wpa=2
wpa_key_mgmt={{KEY_MGMT}}
rsn_pairwise=CCMP
ieee80211w={{IEEE80211W}}
sae_require_mfp=1
sae_pwe=2
wpa_passphrase={{PASSPHRASE}}

# Rotate group keys hourly.
wpa_group_rekey=3600
